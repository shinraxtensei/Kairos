name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest

    # The repository tests exercise JSONB and ON CONFLICT DO NOTHING, which are
    # Postgres behaviour — SQLite would pass while production failed.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy kairos

      - name: Architecture (dependency rule)
        run: uv run lint-imports

      - name: Migrations apply cleanly
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
