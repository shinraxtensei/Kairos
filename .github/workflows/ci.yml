name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy kairos

      - name: Architecture (dependency rule)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest
