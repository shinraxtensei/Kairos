# Host ports are configurable and default off the standard ones. Kairos is not
# the only project on this machine, and 5432/6379 are the first ports every
# other stack claims — a day-job compose file holding them means Kairos simply
# cannot start. Override with KAIROS_POSTGRES_PORT / KAIROS_REDIS_PORT.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    ports:
      - "${KAIROS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - kairos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${KAIROS_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  kairos_pgdata:
